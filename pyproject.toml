[project]
name = "saucedemo-selenium-tests"
version = "1.0.0"
description = "UI test automation framework for SauceDemo with Selenium 4 and pytest"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --html=reports/report.html --self-contained-html"
markers = [
    "smoke: critical-path checks, fast enough to run on every push",
    "defects: documents known defects of SauceDemo's broken demo accounts",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]

name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
        python: ["3.12"]
        include:
          - browser: chrome
            python: "3.11" # oldest supported version
    name: test (${{ matrix.browser }}, py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Let Edge use its sandbox # Ubuntu 24.04 blocks it by default
        if: matrix.browser == 'edge'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run tests
        run: pytest --browser ${{ matrix.browser }} --headless -n 4 --reruns 1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.browser }}-py${{ matrix.python }}
          path: reports/
